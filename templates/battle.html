<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pageExit {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-20px); }
    }
    body.page-enter { animation: pageEnter 300ms ease-out both; }
    body.page-exit  { animation: pageExit  250ms ease-in  both; }
    @media (prefers-reduced-motion: reduce) {
      body.page-enter, body.page-exit { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ node.label }}</h1>
  </header>
  <nav>
    <a href="/adventure">Back to Map</a>
  </nav>
  <div class="container">
    {% if question %}
      <p>{{ question.prompt }}</p>
      <form method="post">
        {% for option in question.options %}
          <div>
            <input type="radio" name="answer" value="{{ option }}" id="{{ option }}" required>
            <label for="{{ option }}">{{ option }}</labe
