<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    @keyframes pageEnter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pageExit  { from { opacity: 1; transform: translateY(0); }  to { opacity: 0; transform: translateY(-20px); } }
    body.page-enter { animation: pageEnter 300ms ease-out both; }
    body.page-exit  { animation: pageExit  250ms ease-in  both; }
    @media (prefers-reduced-motion: reduce) { body.page-enter, body.page-exit { animation: none; } }
  </style>
</head>
<body>
  <header>
    <h1>{{ node.label }}</h1>
  </header>
  <nav>
    <a href="/adventure">Back to Map</a>
  </nav>
  <div class="container">
    {% if question %}
      <p>{{ question.prompt }}</p>
      <form method="post">
        {% for option in question.options %}
          <div>
            <input type="radio" name="answer" value="{{ option }}" id="{{ option }}" required>
            <label for="{{ option }}">{{ option }}</label>
          </div>
        {% endfor %}
        <button type="submit">Submit</button>
      </form>
    {% else %}
      <p>This event is not yet implemented.</p>
    {% endif %}
    <img id="zap-img" class="zap zap-idle" src="{{ url_for('static', filename='zap.png') }}" alt="Zap Mascot">
  </div>
  <script type="module">
    import ZapController from '/static/zap_controller.js';
    const zapImg = document.getElementById('zap-img');
    const zap = new ZapController(zapImg);
  </script>
  <script>
  (function() {
    function triggerEnter() {
      document.body.classList.remove('page-exit', 'page-enter');
      void document.body.offsetWidth;
      document.body.classList.add('page-enter');
    }
    document.addEventListener('DOMContentLoaded', triggerEnter);
    window.addEventListener('pageshow', function(e) { if (e.persisted) triggerEnter(); });
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a[href]');
      if (!a || a.target === '_blank') return;
      e.preventDefault();
      var href = a.href;
      document.body.classList.remove('page-enter');
      document.body.classList.add('page-exit');
      setTimeout(function() { window.location.href = href; }, 260);
    });
  })();
  </script>
</body>
</html>
