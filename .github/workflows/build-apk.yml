name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install JS dependencies
        run: npm install

      - name: Freeze static build
        run: python freeze.py

      - name: Verify dist/ structure
        run: |
          test -f dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)
          test -d dist/static || (echo "ERROR: dist/static/ missing" && exit 1)
          echo "dist/ structure OK"
          ls -la dist/index.html dist/static/styles.css

      - name: Copy capacitor config to root
        run: cp static/capacitor.config.json capacitor.config.json

      - name: Build Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject CSP meta tag for WebView compatibility
        run: |
          # Add viewport-friendly meta to ensure content renders
          sed -i 's|<head>|<head><meta http-equiv="Content-Security-Policy" content="default-src * '\''unsafe-inline'\'' '\''unsafe-eval'\'' data: gap: content:;">|' dist/index.html || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-orbit-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
